repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.30.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format --include
        language: system
        types: [c#]
